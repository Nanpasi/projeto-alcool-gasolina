<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álcool ou Gasolina</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    
    <div id="content">
        <h1>É melhor utilizar álcool ou gasolina?</h1>

        <div id="campo-entrada">
            <label for="preco-alcool">Preço do álcool</label>
            <input type="text" name="alcool" id="preco-alcool" class="entrada">

            <label for="preco-gasolina">Preço da gasolina</label>
            <input type="text" name="gasolina" id="preco-gasolina" class="entrada">
        </div>

        <div id="resultado"><span id="texto-resultado">---</span></div>
        <button id="botao-calcular">Calcular</button>
    </div>

    <div id="temas">
        <button class="botao-cor" id="botao-azul" title="Dark slate blue"></button>
        <button class="botao-cor" id="botao-salmao" title="Salmon"></button>
        <button class="botao-cor" id="botao-dourado" title="Golden rod"></button>
    </div>

</body>
</html>
